<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Paper Soccer AI</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #233044 0, #10131a 70%, #08090d 100%);
            color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 1100px;
            margin: 24px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            letter-spacing: 1px;
            font-size: 34px;
        }

        .subtitle {
            color: #aab2c0;
            margin-top: 6px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 310px;
            gap: 18px;
            align-items: stretch;
        }

        .card {
            background: rgba(24, 28, 38, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        }

        .board-card {
            padding: 16px;
            min-height: 908px;
        }

        .panel {
            padding: 18px;
            min-height: 908px;
            display: flex;
            flex-direction: column;
        }

        svg {
            width: 100%;
            background: #f7f7f2;
            border-radius: 14px;
            display: block;
        }

        .panel-content {
            flex: 1;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            color: #cbd3df;
            font-size: 14px;
        }

        select,
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #394150;
            background: #10141d;
            color: #f0f3f8;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 40px;
            padding: 12px 14px;
            border: 0;
            border-radius: 12px;
            background: #3ddc84;
            color: #06130c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.08);
        }

        .info {
            margin-top: 18px;
            line-height: 1.6;
            font-size: 15px;
            color: #dbe2ec;
        }

        .pill {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 10px;
            background: orange;
            color: #dbe8ff;
            margin-top: 6px;
        }

        .move-hit {
            cursor: pointer;
            fill: transparent;
            pointer-events: all;
        }

        .move-dot {
            pointer-events: none;
        }

        .move-group {
            cursor: pointer;
        }

        .move-group:hover .move-dot {
            opacity: 0.95;
        }

        .hint {
            color: #9aa6b8;
            font-size: 13px;
            line-height: 1.45;
            margin-top: 12px;
        }

        .github-link {
            display: block;
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #9ec5ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .github-link:hover {
            color: #cfe2ff;
        }

        .error {
            color: #ffb4b4;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .board-card,
            .panel {
                min-height: auto;
            }

            .panel {
                position: static;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="header">
            <div>
                <h1>Paper Soccer AI</h1>
                <div class="subtitle">Play against neural bot, heuristic or search algorithm</div>
            </div>
        </div>

        <div class="layout">
            <div class="card board-card">
                <svg id="board" viewBox="0 0 720 900"></svg>
            </div>

            <div class="card panel">
                <div class="panel-content">
                    <h2>New game</h2>

                    <label>Your side</label>
                    <select id="side">
                        <option value="1">Bottom</option>
                        <option value="0">Top</option>
                    </select>

                    <label>Bot mode</label>
                    <select id="mode">
                        <option value="heuristic">Heuristic</option>
                        <option value="search" selected>Search</option>
                        <option value="neural">Neural</option>
                    </select>

                    <label>Search max depth</label>
                    <input id="depth" type="number" min="1" max="12" value="8">

                    <label>Search thinking time [s]</label>
                    <input id="time" type="number" min="0.2" max="30" step="0.1" value="2.0">

                    <button onclick="newGame()">Start new game</button>

                    <div class="hint">
                        Thinking time only changes the search bot. Heuristic and neural modes are almost instant.
                        <br><br>
                        During your turn, click the green target where you want to place the ball.
                    </div>

                    <div class="info" id="info"></div>
                </div>

                <a class="github-link" href="https://github.com/mikelsProject/paper-soccer-ai" target="_blank" rel="noreferrer">
                    View project on GitHub
                </a>
            </div>
        </div>
    </div>

    <script>
        const scale = 55;
        const margin = 80;

        function px(x) {
            return margin + x * scale;
        }

        function py(y) {
            return margin + (y + 1) * scale;
        }

        function el(name, attrs) {
            const e = document.createElementNS("http://www.w3.org/2000/svg", name);

            for (const key in attrs) {
                e.setAttribute(key, attrs[key]);
            }

            return e;
        }

        async function newGame() {
            const payload = {
                side: Number(document.getElementById("side").value),
                mode: document.getElementById("mode").value,
                depth: Number(document.getElementById("depth").value),
                time: Number(document.getElementById("time").value)
            };

            const response = await fetch("/new-game", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!data.ok) {
                document.getElementById("info").innerHTML =
                    "<span class='error'>" + data.message + "</span>";
            }

            await loadBoard();
        }

        async function sendMove(move) {
            await fetch("/move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ move: move })
            });
        }

        function statusText(status) {
            if (status === "human") return "Your move";
            if (status === "bot") return "Bot is thinking";
            if (status.startsWith("gameover_")) return "Game over - " + status.replace("gameover_", "") + " won";
            if (status === "gameover") return "Game over";
            if (status === "waiting") return "Waiting for a new game";
            if (status === "executable_not_found") return "soccer.exe not found";
            return status;
        }

        async function loadBoard() {
            const response = await fetch("/state");
            const data = await response.json();

            const svg = document.getElementById("board");
            svg.innerHTML = "";

            if (!data.ready) {
                document.getElementById("info").innerHTML =
                    "<span class='pill'>" + statusText(data.status) + "</span><br>" +
                    data.message;
                return;
            }

            for (const edge of data.edges) {
                svg.appendChild(el("line", {
                    x1: px(edge.x1),
                    y1: py(edge.y1),
                    x2: px(edge.x2),
                    y2: py(edge.y2),
                    stroke: edge.used ? "#111827" : "#c8ccd2",
                    "stroke-width": edge.used ? 4 : 1.2,
                    "stroke-linecap": "round"
                }));
            }

            for (const v of data.vertices) {
                let color = "#555";
                let r = 4;

                if (v.visited) {
                    color = "#3b82f6";
                    r = 6;
                }

                if (v.ball) {
                    color = "#ef4444";
                    r = 13;
                }

                svg.appendChild(el("circle", {
                    cx: px(v.x),
                    cy: py(v.y),
                    r: r,
                    fill: color
                }));
            }

            if (data.status === "human") {
                for (const m of data.legal_moves) {
                    const g = el("g", {
                        class: "move-group"
                    });

                    const hit = el("circle", {
                        cx: px(m.x),
                        cy: py(m.y),
                        r: 34,
                        class: "move-hit"
                    });

                    const dot = el("circle", {
                        cx: px(m.x),
                        cy: py(m.y),
                        r: 15,
                        fill: "rgba(34, 197, 94, 0.55)",
                        stroke: "#15803d",
                        "stroke-width": 2,
                        class: "move-dot"
                    });

                    g.onclick = () => sendMove(m.move);
                    g.appendChild(hit);
                    g.appendChild(dot);
                    svg.appendChild(g);
                }
            }

            let playerName = data.player === 0 ? "Top" : "Bottom";
            let sideName = data.settings.side === 0 ? "Top" : "Bottom";

            document.getElementById("info").innerHTML =
                "<span class='pill'>" + statusText(data.status) + "</span><br><br>" +
                "You: " + sideName + "<br>" +
                "Bot: " + data.settings.mode + "<br>" +
                "Search: depth " + data.settings.depth + ", " + data.settings.time + " s<br><br>" +
                "Player to move: " + playerName + "<br>" +
                "Ball vertex: " + data.ball + "<br>" +
                "Legal moves: " + data.legal_count;
        }

        loadBoard();
        setInterval(loadBoard, 350);
    </script>
</body>

</html>
